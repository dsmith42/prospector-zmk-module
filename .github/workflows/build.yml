name: Build

# Every check used to run twice: pushing a branch that has an open PR fires
# both `push` and `pull_request`, and this workflow listened for both.
#
# Direct pushes to `block-timer` are blocked by the repository ruleset, so the only
# `push` event left here is the merge commit a PR produces. That build earns its
# place -- it is the firmware matching what is actually flashed, and it catches
# two PRs that were each green alone but break once combined. `pull_request`
# covers everything before that, exactly once.
#
# A branch pushed with no PR open does not build. Open the PR, or use the
# workflow_dispatch button.
#
# Note: the ruleset tracks ~DEFAULT_BRANCH symbolically, but `branches:` cannot
# -- so if the default branch is ever renamed, this line needs renaming too.
on:
  push:
    branches: [block-timer]
  pull_request:
  workflow_dispatch:

jobs:
  # A ZMK module is only compiled when a keyboard config pulls it in, so CI
  # builds one: reference-config/, a keyless split central with the display.
  # See reference-config/README.md.
  #
  # ZMK's reusable workflow detects that this repo is itself a module (it has
  # zephyr/module.yml) and passes the checkout as ZMK_EXTRA_MODULES, building
  # in an isolated workspace. That is what makes the check meaningful: the code
  # under test is this commit, not whatever west would fetch for the branch.
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: reference-config/build.yaml
      config_path: reference-config

  # Single stable check for branch protection. Matrix job names change whenever
  # build.yaml is edited; this one never does, so it can be required once.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Fail if any reference build failed
        if: needs.build.result != 'success'
        run: |
          echo "build result: ${{ needs.build.result }}"
          exit 1
