# CI build targets. Add an entry here to have it built on every push and pull
# request — no workflow changes needed.
#
#   name        appears in the check name; keep it short and unique
#   board       any ZMK board target
#   shield      shields to stack, space separated
#   cmake-args  optional, appended verbatim
#
# The five status screen layouts are built by default so a change to shared
# code (fonts, symbols, the status screen dispatch) cannot break one layout
# while another still compiles.

- name: dial
  board: xiao_ble//zmk
  shield: ref_dongle prospector_adapter
  cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_DIAL=y

- name: operator
  board: xiao_ble//zmk
  shield: ref_dongle prospector_adapter
  cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

- name: classic
  board: xiao_ble//zmk
  shield: ref_dongle prospector_adapter
  cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y

- name: radii
  board: xiao_ble//zmk
  shield: ref_dongle prospector_adapter
  cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y

- name: field
  board: xiao_ble//zmk
  shield: ref_dongle prospector_adapter
  cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
